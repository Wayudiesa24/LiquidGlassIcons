name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/liquidglass-compact-v2.b64'
      - '.github/workflows/build-apk.yml'
      - 'liquidglass-source-*.zip'

permissions:
  contents: read

jobs:
  build:
    name: Compile Liquid Glass v2 Ultra Gloss
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reconstruct the complete Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s source/liquidglass-compact-v2.b64
          base64 --decode source/liquidglass-compact-v2.b64 > /tmp/liquidglass-compact-v2.zip
          echo "dc1a0c38083a7f1b75092e8cf37ad3d825ae5b6285a5ce31ee142589bbaedca1  /tmp/liquidglass-compact-v2.zip" | sha256sum -c -
          unzip -oq /tmp/liquidglass-compact-v2.zip -d .
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wayudiesa/liquidglass/MainActivity.java
          test -f tools/rasterize_svgs.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate all 637 icon PNGs from the original SVG artwork
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg pillow
          python3 tools/rasterize_svgs.py > /tmp/liquidglass-rasterizer.log
          python3 tools/validate_pack.py
          echo "Rendered icon files: $(find app/src/main/res/drawable-nodpi -name '*.png' | wc -l)"

      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace --warning-mode=all :app:assembleDebug

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassIcons-v2-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
