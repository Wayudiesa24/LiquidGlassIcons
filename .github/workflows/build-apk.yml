name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/liquidglass-compact-v2.b64'
      - 'source/glass-overlays.b64'
      - '.github/workflows/build-apk.yml'
      - 'patches/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Liquid Glass v2 Ultra Gloss
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reconstruct complete Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source/liquidglass-compact-v2.b64 > /tmp/liquidglass-source.zip
          echo "dc1a0c38083a7f1b75092e8cf37ad3d825ae5b6285a5ce31ee142589bbaedca1  /tmp/liquidglass-source.zip" | sha256sum -c -
          unzip -oq /tmp/liquidglass-source.zip -d .
          base64 --decode source/glass-overlays.b64 > /tmp/liquidglass-overlays.zip
          echo "3b5f83b1fabd5fa42c35fe381de2e7c0a1cfbd62b2279babb5285f7e05d1c9f5  /tmp/liquidglass-overlays.zip" | sha256sum -c -
          unzip -oq /tmp/liquidglass-overlays.zip -d .
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wayudiesa/liquidglass/MainActivity.java
          test -f app/src/main/res/drawable-nodpi/iconupon.png

      - name: Apply Smart Launcher 6 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          cp patches/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp patches/app-build.gradle app/build.gradle
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          wanted = {"ginlemon.smartlauncher.THEMES", "org.adw.launcher.THEMES", "org.adw.ActivityStarter.THEMES"}
          found = {node.get(ns+"name") for node in root.iter("action")}
          assert wanted <= found, "Smart Launcher discovery filters are missing"
          activities = list(root.iter("activity"))
          assert any(a.get(ns+"name") == ".MainActivity" and a.get(ns+"exported") == "true" for a in activities)
          print("Verified Smart Launcher and ADW discovery actions")
          PY
          grep -q 'versionCode 21' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate all vector icons at 256px
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg pillow
          python3 tools/rasterize_svgs.py > /tmp/liquidglass-rasterizer.log
          python3 tools/validate_pack.py
          echo "Raster icons: $(find app/src/main/res/drawable-nodpi -name '*.png' | wc -l)"

      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify compiled APK announces Smart Launcher theme support
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" AndroidManifest.xml > /tmp/compiled-manifest.txt
          grep -F 'ginlemon.smartlauncher.THEMES' /tmp/compiled-manifest.txt
          grep -F 'org.adw.launcher.THEMES' /tmp/compiled-manifest.txt
          echo "Compiled APK includes Smart Launcher 6 discovery action"

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassIcons-v2.0.1-SmartLauncher-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
