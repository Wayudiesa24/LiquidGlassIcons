name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'liquidglass-source-*.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Liquid Glass v2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify uploaded source archives
        run: |
          set -euo pipefail
          for archive in liquidglass-source-01.zip liquidglass-source-02.zip liquidglass-source-03.zip; do
            if [[ ! -f "$archive" ]]; then
              echo "::error title=Missing source archive::Upload $archive into the repository root (all three ZIPs are required)."
              exit 1
            fi
          done
          echo "All three source archives were found."

      - name: Extract Android project
        run: |
          set -euo pipefail
          for archive in liquidglass-source-01.zip liquidglass-source-02.zip liquidglass-source-03.zip; do
            unzip -oq "$archive" -d .
          done
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android source files extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassIcons-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
